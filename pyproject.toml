[project]
name = "multicloud-ingestion-framework"
version = "1.0.0"
description = "Metadata-driven ingestion from APIs, databases and file drops into S3 / ADLS Gen2 and Snowflake"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]
