name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: make lint
      - name: Tests (S3 via moto, real HTTP API, SQLite, file drop)
        run: make test
      - name: Demo run (three rounds against all sources)
        run: make demo
      - name: Validate ADF definitions are well-formed JSON
        run: python -m json.tool orchestration/adf/pl_ingest_sources.json > /dev/null && python -m json.tool orchestration/adf/tr_hourly.json > /dev/null

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: fmt + validate (AWS and Azure)
        run: make tf-check

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t ingestion-framework:${{ github.sha }} .
      - name: Smoke test
        run: docker run --rm ingestion-framework:${{ github.sha }} python -m ingest plan
